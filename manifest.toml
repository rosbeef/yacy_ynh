#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "yacy"
name = "YaCy"
description.en = "Free and decentralized search engine"
description.fr = "Moteur de recherche libre et décentralisé"

version = "1.940~ynh1"

maintainers = ["Moul"]

[upstream]
license = "GPL-2.0-or-later"
website = "https://yacy.net/"
code = "https://github.com/yacy/yacy_search_server"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "150M"
ram.build = "500M"
ram.runtime = "590M"

[install]
    [install.domain]
    # this is a generic question - ask strings are automatically handled by Yunohost's core
    type = "domain"

    [install.path]
    # this is a generic question - ask strings are automatically handled by Yunohost's core
    type = "path"
    default = "/yacy"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.password]
    # this is a generic question - ask strings are automatically handled by Yunohost's core
    help.en = "Choose an administrator password."
    help.fr = "Choisissez un mot de passe d'administration."
    type = "password"

[resources]
    [resources.sources.main]
    url = "https://github.com/yacy/yacy_search_server/archive/refs/tags/Release_1.940.tar.gz"
    sha256 = "b90fdae376de2365d072b799399d9b6266377029bc9d8092f488d034e3f2bb49"

    autoupdate.strategy = "latest_github_tag"
    autoupdate.asset = ".*\\.tar.gz"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"
    
    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 8090

    [resources.apt]
    packages_from_raw_bash = """
    if [[ $YNH_DEBIAN_VERSION == "bullseye" ]]; then
        echo "openjdk-11-jre";
    elif [[ $YNH_DEBIAN_VERSION == "bookworm" ]]; then
        echo "openjdk-17-jre";
    elif [[ $YNH_DEBIAN_VERSION == "trixie" ]]; then
        echo "openjdk-21-jre";
    fi
    """
